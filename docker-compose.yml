services:
  postgres:
    image: postgres:16-alpine
    container_name: mtg-analyzer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: mtg
      POSTGRES_DB: mtg_analyzer
    ports:
      - '5433:5432'
    volumes:
      - mtg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mtg -d mtg_analyzer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mtg-pgdata:
